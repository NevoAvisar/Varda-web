<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>תודה רבה | ורדה משה</title>

    <!-- Tailwind (same version as main site) -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        sage: {
                            100: '#e8f0ea', 200: '#cdddd1', 600: '#588e69',
                            700: '#4a7a5a', 900: '#2d4f38'
                        }
                    },
                    fontFamily: {
                        display: ['"Playfair Display"', 'serif'],
                        body:    ['Assistant', 'sans-serif']
                    }
                }
            }
        };
    </script>

    <!-- Fonts (same as main site) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Assistant:wght@300;400;600;700&family=Playfair+Display:wght@400;600;700&display=swap" rel="stylesheet" />

    <style>
        body { font-family: 'Assistant', sans-serif; }

        /* ── פולס של הלב הירוק ── */
        @keyframes heartbeat {
            0%, 100% { transform: scale(1);   }
            30%       { transform: scale(1.18); }
            60%       { transform: scale(1.08); }
        }

        .heart {
            display: inline-block;
            color: #588e69;
            animation: heartbeat 1.8s ease-in-out infinite;
            transform-origin: center;
        }

        /* כניסה עדינה לכרטיס */
        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(24px); }
            to   { opacity: 1; transform: translateY(0);    }
        }

        .card-enter {
            animation: fadeUp 0.7s ease both;
        }
    </style>
</head>

<body class="min-h-screen bg-sage-100 flex flex-col items-center justify-center px-4 py-16">

    <!-- כרטיס תודה -->
    <div class="card-enter bg-white rounded-3xl shadow-lg max-w-lg w-full p-8 md:p-12 text-center">

        <!-- לוגו -->
        <a href="index.html" class="inline-block mb-8">
            <img src="assets/images/logo.png" alt="ורדה משה" class="h-14 mx-auto" />
        </a>

        <!-- הודעת תודה -->
        <p class="font-display text-2xl md:text-3xl font-bold text-sage-900 leading-snug mb-6">
            <span id="greeting-name"></span>, תודה רבה!
            <span class="heart" aria-hidden="true">💚</span>
        </p>

        <div class="text-gray-700 leading-loose space-y-4 text-base md:text-lg">
            <p>פנייתך התקבלה אצלנו בהצלחה.</p>
            <p>
                אני מעריכה את האמון שנתת בי, ואחזור אליך בהקדם האפשרי
                כדי לתאם את המשך התהליך.
            </p>
            <p>
                בינתיים, אני מזמינה אותך להמשיך להתרשם מתכנים נוספים
                באתר או לקרוא על שיטות הטיפול שלי.
            </p>
        </div>

        <p class="mt-8 font-display text-sage-700 font-semibold text-lg">שלך, ורדה</p>

        <!-- כפתור חזרה -->
        <a
            href="index.html"
            class="inline-block mt-10 bg-sage-600 hover:bg-sage-700 text-white font-semibold py-3 px-8 rounded-xl transition-all hover:shadow-md hover:-translate-y-0.5"
        >
            חזרה לאתר
        </a>
    </div>

    <script>
        // קריאת שם הפונה מה-URL וכתיבתו לדף
        const params = new URLSearchParams(window.location.search);
        const name   = params.get('name')?.trim() || 'שלום';
        document.getElementById('greeting-name').textContent = name;
    </script>
</body>
</html>
